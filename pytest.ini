[pytest]
# `pythonpath = .` coloca a raiz do projeto no sys.path durante os testes,
# permitindo que os testes usem `from src.config import ...` -- o mesmo
# import que o run_pipeline.py usa. Sem isso seria preciso instalar o
# projeto como pacote, o que e' complexidade desnecessaria aqui.
pythonpath = .
testpaths = tests
